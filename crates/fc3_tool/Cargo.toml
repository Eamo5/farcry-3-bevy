[package]
name = "fc3_tool"
edition.workspace = true
version.workspace = true

[[bin]]
name = "fc3tool"
path = "src/main.rs"

[dependencies]
fc3_formats.workspace = true
fc3_domino.workspace = true
fc3_story.workspace = true
anyhow.workspace = true
naga = { version = "29", features = ["wgsl-in"] }
rayon = "1"
# Ruffle's SWF and ABC reader (the revision `fc3_ui` uses), for `playerglobal-abc`.
swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "2372a4e148a67d68efd796f4477b3cddd4f880cd" }
